<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeCraft - Advanced Online Code Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <!-- 🔐 Auth Container -->
  <div id="auth-container" class="container mx-auto p-4 max-w-md">
    <div class="bg-gray-800 rounded-xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <i class="fas fa-code text-5xl text-blue-500 mb-4"></i>
        <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-500 to-purple-500 text-transparent bg-clip-text">CodeCraft</h1>
        <p class="text-gray-400">Your Advanced Online Code Editor</p>
      </div>

      <!-- Tabs -->
      <div class="flex mb-6 rounded-lg overflow-hidden bg-gray-700">
        <button id="login-tab" class="flex-1 py-3 px-4 text-center bg-blue-600 text-white transition-all duration-300">
          <i class="fas fa-sign-in-alt mr-2"></i>Login
        </button>
        <button id="signup-tab" class="flex-1 py-3 px-4 text-center hover:bg-gray-600 transition-all duration-300">
          <i class="fas fa-user-plus mr-2"></i>Sign Up
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-6">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Email</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
              <input type="email" id="login-email" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" required />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
              <input type="password" id="login-password" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" required />
            </div>
          </div>
        </div>
        <button type="button" id="send-otp-btn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-medium transition-all duration-300 flex items-center justify-center">
          <i class="fas fa-paper-plane mr-2"></i>Send OTP
        </button>

        <!-- OTP Section -->
        <div id="otp-section" class="hidden space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Enter OTP</label>
            <div class="relative">
              <i class="fas fa-key absolute left-3 top-3 text-gray-400"></i>
              <input type="text" id="otp-input" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" maxlength="6" />
            </div>
          </div>
          <button type="button" id="retry-otp-btn" class="w-full bg-yellow-600 hover:bg-yellow-700 py-3 rounded-lg font-medium transition-all duration-300 flex items-center justify-center">
            <i class="fas fa-redo mr-2"></i>Retry OTP
          </button>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-medium transition-all duration-300 flex items-center justify-center">
            <i class="fas fa-check mr-2"></i>Login
          </button>
        </div>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="space-y-6 hidden">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Full Name</label>
            <div class="relative">
              <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
              <input type="text" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" required />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Email</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
              <input type="email" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" required />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Mobile Number</label>
            <div class="relative">
              <i class="fas fa-phone absolute left-3 top-3 text-gray-400"></i>
              <input type="tel" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" required />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
              <input type="password" class="w-full pl-10 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300" required />
            </div>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-medium transition-all duration-300 flex items-center justify-center">
          <i class="fas fa-user-plus mr-2"></i>Sign Up
        </button>
      </form>
    </div>
  </div>

  <!-- 💻 Editor Container -->
  <div id="editor-container" class="container mx-auto p-4 hidden">
    <header class="flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl shadow-lg">
      <div class="flex items-center space-x-4">
        <i class="fas fa-code text-3xl text-blue-500"></i>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-500 to-purple-500 text-transparent bg-clip-text">CodeCraft</h1>
        <span id="user-email" class="text-gray-400"></span>
      </div>
      <div class="flex items-center space-x-4">
        <button class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-all duration-300 flex items-center">
          <i class="fas fa-save mr-2"></i>Save
        </button>
        <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-all duration-300 flex items-center">
          <i class="fas fa-share-alt mr-2"></i>Share
        </button>
        <button class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition-all duration-300 flex items-center">
          <i class="fas fa-sign-out-alt mr-2"></i>Logout
        </button>
      </div>
    </header>

    <div class="grid grid-cols-2 gap-6">
      <!-- Code Editor -->
      <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
        <div class="flex space-x-2 p-4 bg-gray-700 overflow-x-auto">
          <button class="language-tab px-4 py-2 rounded-lg bg-blue-600 text-white transition-all duration-300 flex items-center" data-language="html">
            <i class="fab fa-html5 mr-2"></i>HTML
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="css">
            <i class="fab fa-css3-alt mr-2"></i>CSS
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="js">
            <i class="fab fa-js mr-2"></i>JavaScript
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="python">
            <i class="fab fa-python mr-2"></i>Python
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="java">
            <i class="fab fa-java mr-2"></i>Java
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="cpp">
            <i class="fas fa-code mr-2"></i>C++
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="c">
            <i class="fas fa-code mr-2"></i>C
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="php">
            <i class="fab fa-php mr-2"></i>PHP
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="ruby">
            <i class="fas fa-gem mr-2"></i>Ruby
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="swift">
            <i class="fab fa-swift mr-2"></i>Swift
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="kotlin">
            <i class="fas fa-code mr-2"></i>Kotlin
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="go">
            <i class="fas fa-code mr-2"></i>Go
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="rust">
            <i class="fas fa-code mr-2"></i>Rust
          </button>
          <button class="language-tab px-4 py-2 rounded-lg bg-gray-600 text-white transition-all duration-300 flex items-center" data-language="typescript">
            <i class="fab fa-js mr-2"></i>TypeScript
          </button>
        </div>
        <div id="editor" class="h-[500px]"></div>
      </div>

      <!-- Preview -->
      <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
        <div class="p-4 bg-gray-700 flex justify-between items-center">
          <h3 class="text-lg font-medium">Preview</h3>
          <button class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded-lg transition-all duration-300">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
        <iframe id="preview-frame" class="w-full h-[500px] bg-white rounded-b-xl"></iframe>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/php/php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/ruby/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/swift/swift.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/rust/rust.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
