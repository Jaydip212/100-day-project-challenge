<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Password Generator</h2>
        <input type="text" id="password" readonly>
        <button onclick="copyPassword()">📋 Copy</button>
        
        <div class="options">
            <label>Password Length: <span id="lengthValue">12</span></label>
            <input type="range" id="length" min="6" max="20" value="12" onchange="updateLength()">
            
            <label><input type="checkbox" id="includeNumbers" checked> Include Numbers</label>
            <label><input type="checkbox" id="includeSymbols" checked> Include Symbols</label>
            <label><input type="checkbox" id="includeUppercase" checked> Include Uppercase</label>
        </div>
        
        <button onclick="generatePassword()">🔄 Generate Password</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
