<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="city" placeholder="Enter city name..." autocomplete="off">
        <button onclick="getWeather()">
            <img src="search-icon.png" alt="Search">
        </button>

        <div id="weather-info" class="hidden">
            <h2 id="location"></h2>
            <p><strong>Temperature:</strong> <span id="temp"></span>°C</p>
            <p><strong>Condition:</strong> <span id="condition"></span></p>
            <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
            <p><strong>Wind Speed:</strong> <span id="wind"></span> km/h</p>
            <p><strong>Sunrise:</strong> <span id="sunrise"></span></p>
            <p><strong>Sunset:</strong> <span id="sunset"></span></p>
        </div>
    </div>

    <canvas id="weatherCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
