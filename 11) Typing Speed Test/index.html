<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Typing Speed Test</h2>
        <p id="quote">Click "Start Test" to begin.</p>
        <textarea id="textInput" placeholder="Start typing here..." disabled></textarea>
        <button id="startButton" onclick="startTest()">Start Test</button>
        <button id="submitButton" onclick="checkTyping()" disabled>Submit</button>
        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
