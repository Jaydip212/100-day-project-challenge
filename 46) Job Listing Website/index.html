<!DOCTYPE html>
<html lang="en">
<head>
    <!--jaydip_0113_official-->
    <title>Job Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🚀 Job Finder By Jaydip</h1>
        <input type="text" id="search" placeholder="Search for jobs...">
    </header>

    <div class="job-container">
        <!-- Job 1 -->
        <div class="job-card">
            <img src="https://i.postimg.cc/nrmtJJm4/Software-Engineer-1.jpg" alt="Software Engineer">
            <h3>Software Engineer</h3>
            <p>Company: JAYDIP Pvt Ltd</p>
            <p>Location: Pune</p>
            <button class="apply-btn" data-url="apply.html">Apply Now</button>
        </div>

        <!-- Job 2 -->
        <div class="job-card">
            <img src="https://i.postimg.cc/Hshj6Nfc/Marketing-Manager-2.jpg" alt="Marketing Manager">
            <h3>Marketing Manager</h3>
            <p>Company: jaydip treders </p>
            <p>Location: Mumbai</p>
            <button class="apply-btn" data-url="apply.html">Apply Now</button>
        </div>

        <!-- Job 3 -->
        <div class="job-card">
            <img src="https://i.postimg.cc/0jrPmk5t/Finance-Analyst-3.jpg" alt="Finance Analyst">
            <h3>Finance Analyst</h3>
            <p>Company: jaydip Corp</p>
            <p>Location: karmala </p>
            <button class="apply-btn" data-url="apply.html">Apply Now</button>
        </div>

        <!-- Job 4 -->
        <div class="job-card">
            <img src="https://i.postimg.cc/3x272b7H/cyber-1.jpg" alt="Cyber Security Analyst">
            <h3>Cyber Security Analyst</h3>
            <p>Company: Cyber Office Jaydip </p>
            <p>Location: karmala </p>
            <button class="apply-btn" data-url="apply.html">Apply Now</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
