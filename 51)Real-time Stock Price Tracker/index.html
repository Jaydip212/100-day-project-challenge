<!DOCTYPE html>
<html lang="en">
<head>
    <!--JAYDIP_0113_OFFICIAL-->
    <title>Real-Time Stock Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📈 Real-Time Stock Tracker</h1>
        <input type="text" id="stockSymbol" placeholder="Enter Stock Symbol (e.g., AAPL, TSLA)">
        <button id="fetchStock">Get Price</button>

        <div class="stock-info">
            <h2 id="companyName"></h2>
            <p>Price: <span id="stockPrice"></span></p>
            <p>Change: <span id="stockChange"></span></p>
            <p>Updated at: <span id="lastUpdated"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
