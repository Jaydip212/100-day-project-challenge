<!DOCTYPE html>
<html lang="en">
<head>

       <!-- jaydip_cretion _92-->

    <title>Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Word Counter</h1>
        <div class="textarea-container">
            <textarea id="text-input" placeholder="Start typing or paste your text here..."></textarea>
        </div>
        <div class="stats-container">
            <div class="stat-box">
                <h3>Words</h3>
                <p id="word-count">0</p>
            </div>
            <div class="stat-box">
                <h3>Characters</h3>
                <p id="char-count">0</p>
            </div>
            <div class="stat-box">
                <h3>Characters (no spaces)</h3>
                <p id="char-no-space">0</p>
            </div>
            <div class="stat-box">
                <h3>Sentences</h3>
                <p id="sentence-count">0</p>
            </div>
            <div class="stat-box">
                <h3>Reading Time</h3>
                <p id="reading-time">0 min</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
