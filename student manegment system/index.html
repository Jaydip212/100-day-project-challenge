<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎓 Student Management System</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js "></script>
  <style>
    .logout-btn {
      float: right;
      margin-top: -50px;
      background-color: crimson;
    }
    .greeting {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .chart-container {
      margin: 30px 0;
    }
    .import-export {
      margin-top: 20px;
    }
    .attendance-col select {
      padding: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="greeting" id="user-greeting">Welcome!</span>
    <button class="logout-btn" onclick="logout()">Logout</button>

    <h1>🎓 Student Management System</h1>

    <!-- Dark Mode Toggle -->
    <label class="switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </label>

    <!-- Import / Export -->
    <div class="import-export">
      <input type="file" id="csvFile" accept=".csv" />
      <button onclick="importFromCSV()">Import CSV</button>
      <button onclick="exportToCSV()">Export to CSV</button>
    </div>

    <!-- Add Student Form -->
    <form id="student-form">
      <input type="text" id="name" placeholder="Student Name" required/>
      <input type="number" id="age" placeholder="Age" required/>
      <input type="text" id="course" placeholder="Course" required/>
      <button type="submit">Add Student</button>
    </form>

    <!-- Chart -->
    <div class="chart-container">
      <canvas id="studentChart" width="400" height="200"></canvas>
    </div>

    <!-- Student Table -->
    <table id="student-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
          <th class="attendance-col">Attendance</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Rows will be injected here -->
      </tbody>
    </table>
  </div>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
