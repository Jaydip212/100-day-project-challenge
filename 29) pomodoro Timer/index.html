<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pomodoro Timer jaydip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍅 Pomodoro Timer </h1>
        <div class="timer-circle">
            <span id="time">25:00</span>
        </div>
        <div class="buttons">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
        <div class="mode">
            <button id="work-mode">Work</button>
            <button id="break-mode">Break</button>
        </div>
    </div>
    <audio id="alarm" src="simplemusicjaydip.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
