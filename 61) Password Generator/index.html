<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<!--@jaydip_0113_official--> 
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <input type="text" id="password" readonly placeholder="Your password will appear here">
        <div class="options">
            <label><input type="checkbox" id="uppercase"> Include Uppercase</label>
            <label><input type="checkbox" id="lowercase"> Include Lowercase</label>
            <label><input type="checkbox" id="numbers"> Include Numbers</label>
            <label><input type="checkbox" id="symbols"> Include Symbols</label>
        </div>
        <div class="slider-group">
            <label for="length">Password Length: <span id="lengthValue">12</span></label>
            <input type="range" id="length" min="4" max="32" value="12">
        </div>
        <button id="generate">Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
