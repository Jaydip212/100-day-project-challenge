<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text to Speech Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Text to Speech Converter</h1>
        <div class="wrapper">
            <textarea placeholder="Enter your text here..."></textarea>
            <div class="controls">
                <div class="voice-options">
                    <select></select>
                    <div class="speed-control">
                        <label>Speed: <span class="speed-value">1x</span></label>
                        <input type="range" min="0.5" max="2" value="1" step="0.1" class="speed-slider">
                    </div>
                </div>
                <div class="buttons">
                    <button class="play"><i class="fas fa-play"></i> Play</button>
                    <button class="pause"><i class="fas fa-pause"></i> Pause</button>
                    <button class="stop"><i class="fas fa-stop"></i> Stop</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
