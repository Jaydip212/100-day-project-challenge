<!DOCTYPE html>
<html lang="en">
<head>
    <!--jaydip_0113_official-->
    <title>AI Resume Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="builder-section">
        <h2>Resume Builder</h2>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Professional Summary</label>
            <textarea id="summary" rows="3"></textarea>
            <div class="ai-suggestion" onclick="generateSummary()">
                � Generate AI Summary
            </div>
        </div>

        <div class="form-group">
            <label>Work Experience</label>
            <div id="experienceFields">
                <div class="experience-entry">
                    <input type="text" placeholder="Job Title" class="job-title">
                    <input type="text" placeholder="Company Name" class="company">
                    <textarea placeholder="Description"></textarea>
                </div>
            </div>
            <button onclick="addExperienceField()">+ Add Experience</button>
        </div>

        <!-- Add more sections (Education, Skills, etc.) similarly -->
    </div>

    <div class="preview-section">
        <div class="resume-preview" id="resumePreview">
            <div class="resume-header">
                <h1 id="previewName">John Doe</h1>
                <p id="previewSummary">Experienced professional with...</p>
            </div>
            
            <div class="resume-section">
                <h3 class="section-title">Work Experience</h3>
                <div id="previewExperience"></div>
            </div>
        </div>
        <button onclick="downloadResume()">Download PDF</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
