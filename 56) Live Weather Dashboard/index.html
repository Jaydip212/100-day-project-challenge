<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/erikflowers/weather-icons@2.0.12/css/weather-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h1><i class="wi wi-barometer"></i> Weather Dashboard create by jaydip</h1>
            <div class="search-box">
                <input type="text" placeholder="Enter city name" class="search-input">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        
        <div class="weather-container">
            <div class="current-weather">
                <div class="weather-info">
                    <div class="location-info">
                        <h2 class="city-name">--</h2>
                        <p class="date">--</p>
                    </div>
                    <div class="main-weather">
                        <div class="temperature">
                            <span class="temp-value">--</span>
                            <span class="temp-unit">°C</span>
                        </div>
                        <div class="weather-icon">
                            <i class="wi wi-day-sunny icon"></i>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail">
                            <i class="wi wi-strong-wind"></i>
                            <span class="wind-speed">-- km/h</span>
                        </div>
                        <div class="detail">
                            <i class="wi wi-humidity"></i>
                            <span class="humidity">--%</span>
                        </div>
                        <div class="detail">
                            <i class="wi wi-barometer"></i>
                            <span class="pressure">-- hPa</span>
                        </div>
                        <div class="detail">
                            <i class="wi wi-sunrise"></i>
                            <span class="sunrise">--:--</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="forecast-container">
                <h3><i class="wi wi-forecast-io-partly-cloudy-day"></i> 5-Day Forecast</h3>
                <div class="forecast-cards">
                    <!-- Forecast cards will be added dynamically -->
                </div>
            </div>

            <div class="additional-info">
                <div class="info-card">
                    <h4><i class="wi wi-thermometer"></i> Feels Like</h4>
                    <p class="feels-like">--°C</p>
                </div>
                <div class="info-card">
                    <h4><i class="wi wi-umbrella"></i> Precipitation</h4>
                    <p class="precipitation">--%</p>
                </div>
                <div class="info-card">
                    <h4><i class="wi wi-cloud"></i> Cloud Cover</h4>
                    <p class="cloud-cover">--%</p>
                </div>
                <div class="info-card">
                    <h4><i class="wi wi-sunset"></i> Sunset</h4>
                    <p class="sunset">--:--</p>
                </div>
            </div>
        </div>
    </div>
 </div>
    <script src="script.js"></script>
</body>
</html>
